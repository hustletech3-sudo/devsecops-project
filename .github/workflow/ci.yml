name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    # 1. Code checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Node
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # 3. Install dependencies
    - name: Install Dependencies
      run: npm install

    # 4. Run basic check
    - name: Run App Test
      run: node app.js &
    
    # 5. Docker build
    - name: Build Docker Image
      run: docker build -t devsecops-app .

    # 6. Docker verify
    - name: List Docker Images
      run: docker images